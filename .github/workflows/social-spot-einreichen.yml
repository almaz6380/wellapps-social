name: Spots einreichen

# Fertige Videos aus tools/social/spots/einreichen.json in die Freigabe-App
# und (wahlweise) in die TikTok-Postfaecher der App-Konten.
#
# ⚠ Nur auf Josefs ausdruecklichen Wunsch ausloesen (CLAUDE.md, 28.09.2026).
# TikTok bekommt die Videos nur in den POSTEINGANG — veroeffentlicht wird
# von Hand in der TikTok-App, mit Text, Privatsphaere und KI-Label.

on:
  workflow_dispatch:
    inputs:
      modus:
        description: 'trocken = nur Texte und Regeln pruefen, echt = hochladen'
        type: choice
        options: [trocken, echt]
        required: true
      tiktok:
        description: 'Auch ins TikTok-Postfach laden?'
        type: choice
        options: [nein, ja]
        required: true
      meta:
        description: 'Instagram + Facebook in der Freigabe-App vormerken?'
        type: choice
        options: [nein, ja]
        required: false
        default: nein
      neu:
        description: 'Video neu hochladen (geaenderte Fassung ersetzt die alte)?'
        type: choice
        options: [nein, ja]
        required: false
        default: nein
      datum:
        description: 'Tag der Freigabe-Liste (JJJJ-MM-TT), leer = heute'
        type: string
        required: false
      nur:
        description: 'Nur diese Videos (Dateinamen, kommagetrennt) — leer = ganze Liste'
        type: string
        required: false

jobs:
  einreichen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Abhaengigkeiten
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Einreichen
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN_ANIGOSHA: ${{ secrets.TIKTOK_REFRESH_TOKEN_ANIGOSHA }}
          TIKTOK_REFRESH_TOKEN_MAHJONG: ${{ secrets.TIKTOK_REFRESH_TOKEN_MAHJONG }}
          TIKTOK_REFRESH_TOKEN_WELLBOOKED: ${{ secrets.TIKTOK_REFRESH_TOKEN_WELLBOOKED }}
          TIKTOK_REFRESH_TOKEN_FULLREP: ${{ secrets.TIKTOK_REFRESH_TOKEN_FULLREP }}
          TIKTOK_REFRESH_TOKEN_SWAPLY: ${{ secrets.TIKTOK_REFRESH_TOKEN_SWAPLY }}
          BLOB_TOKEN: ${{ secrets.BLOB_TOKEN }}
          MODUS: ${{ inputs.modus }}
          TIKTOK: ${{ inputs.tiktok }}
          NUR: ${{ inputs.nur }}
          META: ${{ inputs.meta }}
          DATUM: ${{ inputs.datum }}
          NEU: ${{ inputs.neu }}
        run: |
          ARGS=""
          [ "$MODUS" = "echt" ] && ARGS="$ARGS --echt"
          [ "$TIKTOK" = "ja" ] && ARGS="$ARGS --tiktok"
          [ "$META" = "ja" ] && ARGS="$ARGS --meta"
          [ "$NEU" = "ja" ] && ARGS="$ARGS --neu"
          node tools/social/spot-einreichen.mjs $ARGS
