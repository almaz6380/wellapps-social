name: TikTok-Zugang holen

# Holt den Refresh-Token fuer EIN TikTok-Konto. Je Konto einmal auszufuehren.
#
# ⚠ Warum ein Workflow und nicht der Browser: Der zweite Schritt ist ein POST
# an TikTok mit dem App-Geheimnis im Rumpf. Eine Adresszeile kann kein POST,
# und das Geheimnis gehoert nicht in eine URL. Hier liegt es in den
# GitHub-Secrets und verlaesst sie nicht.
#
# ⚠ Der Refresh-Token wird im Protokoll ausgegeben — er muss ja in ein Secret,
# und dorthin kann ihn nur ein Mensch eintragen. Nach dem Eintragen das
# Protokoll dieses Laufs loeschen: Actions → Lauf → „…" → Delete logs.

on:
  workflow_dispatch:
    inputs:
      schritt:
        description: 'link = Anmeldeadresse erzeugen · tausch = Code einloesen'
        type: choice
        options: [link, tausch]
        default: link
      code:
        description: 'Nur bei schritt=tausch: der Wert hinter ?code= aus der Adresszeile'
        type: string
        required: false

jobs:
  zugang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: TikTok-Zugang
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          SCHRITT: ${{ inputs.schritt }}
          CODE: ${{ inputs.code }}
        run: node tools/social/tiktok-zugang.mjs
