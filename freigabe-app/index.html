<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Freigabe</title>
<style>
  /* Handy zuerst — die Seite wird fast nur dort benutzt. */
  :root {
    --grund: #0f0d17; --karte: #1a1726; --rand: #2c2740;
    --tinte: #f2effa; --leise: #9d95b8; --akzent: #e0459b; --gut: #3ec98a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--grund); color: var(--tinte);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
    max-width: 640px; margin-inline: auto;
  }
  h1 { font-size: 22px; margin: 4px 0 2px; }
  .leise { color: var(--leise); font-size: 14px; }
  .karte { background: var(--karte); border: 1px solid var(--rand); border-radius: 16px; padding: 14px; margin: 14px 0; }
  .app-kopf { display: flex; align-items: baseline; gap: 8px; margin: 26px 0 4px; }
  .app-kopf h2 { font-size: 18px; margin: 0; }
  video, img.medium { width: 100%; border-radius: 12px; display: block; background: #000; }
  /* ⚠ Deckel, sonst fuellt ein 9:16-Video den ganzen Bildschirm und man
     scrollt ewig, um fuenf Apps durchzusehen. */
  video, img.medium { max-height: 46vh; object-fit: contain; }
  /* Karussell: waagrecht wischen statt untereinander. Sechs Folien
     untereinander waeren auf dem Handy eine halbe Bildschirmseite je Folie —
     man scrollt dann an den Knoepfen vorbei, statt die Folien zu vergleichen. */
  .karussell { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
  .karussell .folie { flex: 0 0 62%; scroll-snap-align: start; margin: 0; }
  .karussell figcaption { text-align: center; margin-top: 4px; }
  .text {
    white-space: pre-wrap; word-break: break-word; font-size: 14px;
    background: #12101c; border: 1px solid var(--rand); border-radius: 10px;
    padding: 10px; margin: 10px 0 8px; max-height: 8.5em; overflow: auto;
  }
  .reihe { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 11px;
    padding: 11px 16px; background: var(--akzent); color: #fff; cursor: pointer;
  }
  button.rand { background: transparent; color: var(--tinte); border: 1px solid var(--rand); }
  button:disabled { opacity: .45; cursor: default; }
  .marke { font-size: 12px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--rand); color: var(--leise); }
  .marke.gut { color: var(--gut); border-color: #24543f; }
  .marke.schlecht { color: #ff8f8f; border-color: #5a2b2b; }
  input {
    font: inherit; width: 100%; padding: 12px; border-radius: 11px;
    border: 1px solid var(--rand); background: #12101c; color: var(--tinte);
  }
  .kopfleiste { display: flex; gap: 8px; align-items: center; margin: 14px 0; }
  .kopfleiste input { flex: 1; }
  .hinweis { font-size: 13px; color: var(--leise); margin-top: 8px; }
  [hidden] { display: none !important; }

  /* Block „Neuen Beitrag bauen". Er teilt sich das Aussehen der Eingabefelder
     mit dem Rest; nur textarea und select brauchen es ausdruecklich, weil die
     Regel oben nur `input` nennt. */
  textarea, select {
    font: inherit; width: 100%; padding: 12px; border-radius: 11px;
    border: 1px solid var(--rand); background: #12101c; color: var(--tinte);
  }
  textarea { resize: vertical; min-height: 84px; }
  .feldname { display: block; font-size: 13px; color: var(--leise); margin: 12px 0 5px; }
  summary { font-weight: 600; cursor: pointer; }
  /* ⚠ Der Zaehler faerbt sich, BEVOR der Lauf abbricht. Der Generator lehnt
     zu langen Text erst nach zehn Minuten ab — das hier ist die Antwort in
     Echtzeit. */
  .voll { color: #ff8f8f; }

  /* TikTok-Block. Er sieht bewusst nach Formular aus: TikTok verlangt, dass
     der Mensch hier aktiv waehlt, und das soll man sehen. */
  .tt { border-top: 1px solid var(--rand); margin-top: 12px; padding-top: 12px; }
  .tt h4 { margin: 0 0 2px; font-size: 14px; }
  .tt .konto { font-size: 12px; color: var(--leise); margin: 0 0 10px; }
  .tt label { display: flex; gap: 9px; align-items: flex-start; font-size: 14px;
    padding: 7px 0; cursor: pointer; }
  .tt input[type=radio], .tt input[type=checkbox] {
    width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--akzent); flex: none; }
  .tt .gruppe { margin-bottom: 4px; }
  .tt .titel { font-size: 12px; color: var(--leise); text-transform: uppercase;
    letter-spacing: .04em; margin: 12px 0 2px; }
  .tt .recht { font-size: 12px; color: var(--leise); margin: 12px 0 10px; }
  .tt .recht a { color: var(--leise); }
</style>
</head>
<body>

<h1>Freigabe</h1>
<p class="leise" id="untertitel">Die Entwürfe des Tages, aus allen fünf Apps.</p>

<!-- Anmeldung -->
<section id="tor" class="karte">
  <p class="leise" style="margin-top:0">Passwort</p>
  <input id="pw" type="password" autocomplete="current-password" enterkeyhint="go">
  <div class="reihe" style="margin-top:10px"><button id="rein">Öffnen</button></div>
  <p class="hinweis" id="torfehler"></p>
</section>

<!-- Inhalt -->
<section id="inhalt" hidden>
  <div class="kopfleiste">
    <input id="datum" type="date">
    <button class="rand" id="neu">Laden</button>
  </div>

  <!--
    Neuer Beitrag auf Zuruf.

    ⚠ Zugeklappt, und das ist Absicht: Diese Seite ist zum FREIGEBEN da. Ein
    aufgeklapptes Formular ganz oben verdraengt jeden Tag die Beitraege, die
    eigentlich auf einen Knopfdruck warten.

    ⚠ Nur Anigosha in der Auswahl. Das Format „freie-karte" steckt in
    anigosha/tools/post-bild.mjs; die vier anderen Apps haben es noch nicht.
    Lieber ein Menue mit einer Zeile als vier, von denen drei eine
    Fehlermeldung liefern.
  -->
  <details id="neuer" class="karte">
    <summary>Neuen Beitrag bauen</summary>
    <p class="leise" style="margin:10px 0 0">
      Eine Karte im Design der App, mit deinem Text. Sie ist in etwa zehn
      Minuten hier und wartet dann auf deinen Knopf — von allein geht nichts
      raus.
    </p>

    <label class="feldname" for="k-app">App</label>
    <select id="k-app"><option value="anigosha">Anigosha</option></select>

    <label class="feldname" for="k-medium">Als was?</label>
    <select id="k-medium">
      <option value="bild">Karte — Facebook und Instagram</option>
      <option value="reel">Video — auch TikTok</option>
    </select>
    <p class="hinweis" id="k-medienhinweis"></p>

    <label class="feldname" for="k-text">Text</label>
    <textarea id="k-text" maxlength="240" enterkeyhint="done"
      placeholder="Wer drei Tage nicht spielt, verliert seinen Streak."></textarea>
    <p class="hinweis" id="k-zaehler">0 / 240</p>

    <!--
      ⚠ Haken und Marke verschwinden beim Video, statt wirkungslos dazustehen.
      Die Reel-Vorlage kennt beide nicht. Ein Feld, das man ausfüllen kann und
      das dann nichts tut, ist schlimmer als keines — man sucht den Fehler
      später im fertigen Video.
    -->
    <div id="k-nurbild">
      <label class="feldname" for="k-haken">Kleine Zeile darüber (optional)</label>
      <input id="k-haken" maxlength="60" placeholder="Wusstest du?">

      <label class="feldname" for="k-marke">Pille ganz oben (optional)</label>
      <input id="k-marke" maxlength="60" placeholder="Anigosha 1.1">
    </div>

    <label class="feldname" for="k-cta">Schlusszeile (optional)</label>
    <input id="k-cta" maxlength="60" placeholder="anigosha.vercel.app/get">

    <div class="reihe" style="margin-top:14px">
      <button id="k-bauen">Bauen</button>
    </div>
    <p class="hinweis" id="k-stand"></p>
  </details>

  <div id="liste"></div>
</section>

<script>
// ⚠ Das Passwort liegt in localStorage, damit die Seite nicht bei jedem
// Öffnen danach fragt. Das ist bewusst: Es schützt keine Geheimnisse (siehe
// den Kommentar in api/freigabe.js), sondern verhindert, dass Fremde die
// Seite bedienen. Auf einem fremden Gerät gehört es nicht gespeichert —
// dafür gibt es unten „Abmelden".
const SCHLUESSEL = 'wellapps.freigabe.pw';
const $ = (s) => document.querySelector(s);
const el = (t, k, txt) => { const d = document.createElement(t); if (k) d.className = k; if (txt != null) d.textContent = txt; return d; };

let passwort = '';

async function ruf(aktion, extra = {}) {
  const antwort = await fetch('/api/freigabe', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ passwort, aktion, ...extra }),
  });
  const daten = await antwort.json().catch(() => ({ fehler: `HTTP ${antwort.status}` }));
  if (!antwort.ok) throw new Error(daten.fehler || `HTTP ${antwort.status}`);
  return daten;
}

const KANAL_NAME = { facebook: 'Facebook', tiktok: 'TikTok', instagram: 'Instagram' };

// ------------------------------------------------- Versuche merken
//
// ⚠ Warum es das gibt (19.09.2026). Der Knopf setzte nach dem Auslösen
// „Läuft — dauert etwa eine Minute" und tat danach NICHTS mehr: kein
// Nachladen, keine Rückmeldung. Josef hat an einem Vormittag viermal getippt
// und geschrieben „Es passiert nichts!!!" — während vier Facebook-Beiträge
// wirklich draußen waren und zwei Instagram-Läufe wirklich gescheitert sind.
// Beides sah auf der Seite gleich aus.
//
// Nachladen allein genügt aber nicht: Ein gescheiterter Lauf sieht danach
// exakt aus wie ein nie gestarteter — derselbe Knopf, derselbe Text. Deshalb
// ein Vermerk je Kanal und Datei. Steht der Beitrag nach dem Nachladen immer
// noch offen, war der Versuch erfolglos, und die Karte sagt es.
//
// sessionStorage, nicht localStorage: Der Vermerk gilt für diesen Besuch. Wer
// die Seite morgen öffnet, soll nicht die Warnung von gestern lesen.
const VERSUCH_MS = 60000;

function versuchSchluessel(kanal, datum, datei) {
  return `freigabe.versuch.${kanal}.${datum}.${datei}`;
}
function versuchMerken(kanal, datum, datei) {
  try { sessionStorage.setItem(versuchSchluessel(kanal, datum, datei), Date.now()); } catch { /* privates Fenster */ }
}
function versuchLesen(kanal, datum, datei) {
  try {
    const w = Number(sessionStorage.getItem(versuchSchluessel(kanal, datum, datei)));
    return Number.isFinite(w) && w > 0 ? w : null;
  } catch { return null; }
}
function versuchVergessen(kanal, datum, datei) {
  try { sessionStorage.removeItem(versuchSchluessel(kanal, datum, datei)); } catch { /* egal */ }
}

/**
 * Die Zeile „der letzte Versuch hat nichts geändert" — oder nichts.
 *
 * Nur wenn der Versuch lange genug her ist: Wer zwei Sekunden nach dem Tippen
 * die Seite neu lädt, hat keinen Fehler gesehen, sondern einen laufenden Lauf.
 */
function versuchWarnung(kanal, datum, datei) {
  const wann = versuchLesen(kanal, datum, datei);
  if (!wann || Date.now() - wann < VERSUCH_MS) return null;
  const uhr = new Date(wann).toLocaleTimeString('de-AT', { hour: '2-digit', minute: '2-digit' });
  const p = el('p', 'leise', `⚠ Der Versuch um ${uhr} hat nichts geändert — `
    + `${KANAL_NAME[kanal]} steht weiterhin offen. Im Lauf auf GitHub nachsehen.`);
  p.style.marginTop = '8px';
  return p;
}

const STAND_TEXT = {
  entwurf: 'Entwurf liegt bereit',
  posteingang: 'im Posteingang',
  wartet: 'wartet auf dich',
  veroeffentlicht: 'veröffentlicht',
  uebersprungen: 'übersprungen',
  fehler: 'Fehler',
  trocken: 'nur Probelauf',
};

function markeFuer(kanal, stand, eintrag) {
  const gut = ['entwurf', 'posteingang', 'veroeffentlicht'].includes(stand)
    || eintrag?.veroeffentlicht;
  const schlecht = stand === 'fehler';
  const text = eintrag?.veroeffentlicht
    ? `${KANAL_NAME[kanal]}: veröffentlicht`
    : `${KANAL_NAME[kanal]}: ${STAND_TEXT[stand] ?? stand}`;
  return el('span', `marke${gut ? ' gut' : ''}${schlecht ? ' schlecht' : ''}`, text);
}

function postKarte(post, liste) {
  const k = el('div', 'karte');

  // Ein abgelehnter Beitrag bleibt sichtbar, aber tot: keine Knoepfe, gedimmt.
  // Er verschwinden zu lassen waere bequemer und schlechter — dann waere am
  // Abend nicht mehr nachvollziehbar, was verworfen wurde.
  if (post.abgelehnt) {
    k.style.opacity = '.5';
    k.append(el('p', 'marke', 'abgelehnt'));
  }

  // ⚠ Beim Karussell ALLE Folien zeigen, nicht nur die erste. Man gibt frei,
  // was man gesehen hat — eine Vorschau, die Folie 1 zeigt und Folie 2 bis 6
  // verschweigt, macht den Knopf zu einer Unterschrift auf Ungesehenes.
  const folien = Array.isArray(post.urls) ? post.urls.filter(Boolean) : [];
  if (folien.length >= 2) {
    const streifen = el('div', 'karussell');
    folien.forEach((u, i) => {
      const f = el('figure', 'folie');
      const b = el('img', 'medium');
      b.src = u;
      b.loading = 'lazy';
      f.append(b, el('figcaption', 'leise', `${i + 1} / ${folien.length}`));
      streifen.append(f);
    });
    k.append(streifen);
  } else if (post.url) {
    const m = post.istVideo ? el('video') : el('img', 'medium');
    if (post.istVideo) { m.controls = true; m.playsInline = true; m.preload = 'metadata'; }
    m.src = post.url;
    k.append(m);
  } else {
    k.append(el('p', 'leise', 'Keine Vorschau — an dem Tag lief nur ein einzelner Kanal.'));
  }

  k.append(el('div', 'text', post.text || '(kein Text)'));

  const marken = el('div', 'reihe');
  // ⚠ Der GRUND eines Fehlers gehört auf die Seite, nicht nur ins
  // Laufprotokoll. Am 19.09.2026 stand hier bloß „TikTok: Fehler" — vor und
  // nach einem neuen Versuch derselbe Text. Es sah aus, als passiere nichts,
  // während TikTok sehr wohl geantwortet hatte
  // („unaudited_client_can_only_post_to_private_accounts"). Wer vom Handy
  // arbeitet, kommt ans Protokoll nicht heran; dann ist eine Marke ohne Grund
  // so gut wie keine Marke.
  const gruende = [];
  for (const [kanal, ergebnis] of Object.entries(post.kanaele ?? {})) {
    // Der Instagram-Eintrag kennt als Einziger einen „veröffentlicht"-Vermerk;
    // er steht in der Merkliste, nicht in der Übersicht.
    const eintrag = kanal === 'instagram'
      ? (liste.eintraege ?? []).find((e) => e.datei === post.datei)
      : null;
    marken.append(markeFuer(kanal, ergebnis.stand, eintrag));
    if (ergebnis.stand === 'fehler' && ergebnis.meldung) {
      gruende.push(`${KANAL_NAME[kanal]}: ${ergebnis.meldung}`);
    }
  }
  k.append(marken);
  for (const g of gruende) {
    const p = el('p', 'leise', g);
    p.style.marginTop = '6px';
    k.append(p);
  }

  const knoepfe = el('div', 'reihe');
  knoepfe.style.marginTop = '10px';
  // Sammelt die Warnungen „der letzte Versuch hat nichts geändert". Sie stehen
  // UNTER den Knöpfen, nicht darin: Der Knopf soll weiter sagen, was er tut.
  const nachtrag = el('div');
  const kopieren = el('button', 'rand', 'Text kopieren');
  kopieren.onclick = async () => {
    try {
      await navigator.clipboard.writeText(post.text || '');
      kopieren.textContent = 'Kopiert ✓';
      setTimeout(() => { kopieren.textContent = 'Text kopieren'; }, 1600);
    } catch {
      kopieren.textContent = 'Ging nicht — von Hand markieren';
    }
  };
  knoepfe.append(kopieren);

  // Facebook: ein Knopf, sonst nichts zu waehlen — der Beitrag entsteht aus
  // genau der Datei und dem Text, die hier darueber stehen.
  //
  // ⚠ Zwei Tipper, nicht einer. Der Beitrag ist danach oeffentlich, und auf
  // einem Handy sitzt ein Fehltipp schnell. Zurueckholen kann ihn nur Loeschen.
  if (!post.abgelehnt && post.kanaele?.facebook?.stand === 'wartet') {
    const fb = el('button', null, 'Auf Facebook veröffentlichen');
    let sicher = false;
    fb.onclick = async () => {
      if (!sicher) {
        sicher = true;
        fb.textContent = 'Wirklich? Nochmal tippen';
        // Nach zehn Sekunden zurueck — sonst steht die scharfe Fassung des
        // Knopfes noch da, wenn man spaeter zufaellig hintippt.
        setTimeout(() => {
          if (!sicher) return;
          sicher = false; fb.textContent = 'Auf Facebook veröffentlichen';
        }, 10000);
        return;
      }
      sicher = false;
      fb.disabled = true; fb.textContent = 'Wird veröffentlicht …';
      try {
        await ruf('facebook', { datum: liste.datum, app: liste.app, datei: post.datei });
        // ⚠ Vermerken BEVOR der Erfolg feststeht — genau der Fall, den die
        // Warnung abfangen soll, ist ja der, in dem der Lauf spaeter scheitert.
        versuchMerken('facebook', liste.datum, post.datei);
        fb.textContent = 'Läuft — Ergebnis in etwa einer Minute';
        // Danach die Merkliste neu holen: Die Karte zeigt dann entweder
        // „veröffentlicht" oder — über versuchWarnung — dass nichts geschah.
        setTimeout(laden, VERSUCH_MS);
      } catch (e) {
        fb.disabled = false;
        fb.textContent = `Fehler: ${e.message}`;
      }
    };
    knoepfe.append(fb);
    const warnung = versuchWarnung('facebook', liste.datum, post.datei);
    if (warnung) nachtrag.append(warnung);
  } else if (post.kanaele?.facebook?.stand === 'veroeffentlicht') {
    // Geglückt — der Vermerk hat seinen Zweck erfüllt und darf weg, sonst
    // warnt die Seite beim nächsten Laden über einen Versuch, der gelang.
    versuchVergessen('facebook', liste.datum, post.datei);
  }

  // Instagram — ebenfalls je Beitrag.
  //
  // ⚠ Bis zum 09.09.2026 stand hier nichts: Instagram hatte EINEN Sammelknopf
  // je App, ganz unten. Der gab immer alles frei, was offen war — „diesen ja,
  // jenen nicht" ging gar nicht. Und weil Facebook je Beitrag freigegeben
  // wird, sah dieselbe Karte mal nach „nur Facebook moeglich" aus und mal
  // nach „nur Instagram", je nachdem wohin man schaute.
  const igOffen = (liste.eintraege ?? [])
    .some((e) => e.datei === post.datei && !e.veroeffentlicht);
  if (!post.abgelehnt && igOffen) {
    const ig = el('button', null, 'Auf Instagram veröffentlichen');
    let sicher = false;
    ig.onclick = async () => {
      if (!sicher) {
        sicher = true;
        ig.textContent = 'Wirklich? Nochmal tippen';
        setTimeout(() => {
          if (!sicher) return;
          sicher = false; ig.textContent = 'Auf Instagram veröffentlichen';
        }, 10000);
        return;
      }
      sicher = false;
      ig.disabled = true; ig.textContent = 'Wird veröffentlicht …';
      try {
        await ruf('veroeffentlichen', {
          datum: liste.datum, app: liste.app, datei: post.datei,
        });
        versuchMerken('instagram', liste.datum, post.datei);
        ig.textContent = 'Läuft — Ergebnis in etwa einer Minute';
        setTimeout(laden, VERSUCH_MS);
      } catch (e) {
        ig.disabled = false;
        ig.textContent = `Fehler: ${e.message}`;
      }
    };
    knoepfe.append(ig);
    const warnung = versuchWarnung('instagram', liste.datum, post.datei);
    if (warnung) nachtrag.append(warnung);
  } else if (!post.abgelehnt) {
    versuchVergessen('instagram', liste.datum, post.datei);
  }

  // Ablehnen — solange noch nichts von diesem Beitrag draussen ist.
  //
  // ⚠ Ein bereits veroeffentlichter Beitrag bekommt den Knopf NICHT. Ihn hier
  // „abzulehnen" waere ein falscher Vermerk: Er ist draussen, und zurueckholen
  // kann ihn nur Loeschen im jeweiligen Netzwerk. Das Skript wuerde ohnehin
  // abbrechen — der Knopf soll gar nicht erst dazu einladen.
  const irgendwoDraussen = Object.values(post.kanaele ?? {})
    .some((e) => e.stand === 'veroeffentlicht')
    || (liste.eintraege ?? []).some((e) => e.datei === post.datei && e.veroeffentlicht);

  if (!post.abgelehnt && !irgendwoDraussen) {
    const ab = el('button', 'rand', 'Ablehnen');
    let sicher = false;
    ab.onclick = async () => {
      if (!sicher) {
        sicher = true;
        ab.textContent = 'Ablehnen? Nochmal tippen';
        setTimeout(() => {
          if (!sicher) return;
          sicher = false; ab.textContent = 'Ablehnen';
        }, 10000);
        return;
      }
      sicher = false;
      ab.disabled = true; ab.textContent = 'Wird abgelehnt …';
      try {
        await ruf('ablehnen', { datum: liste.datum, app: liste.app, datei: post.datei });
        // ⚠ Der Ersatz ist ein EIGENER Lauf, kein Teil des Ablehnens: Ablehnen
        // dauert Sekunden, Rendern zehn Minuten. Wer beides verschmilzt, laesst
        // den Menschen zehn Minuten im Unklaren, ob wenigstens das Ablehnen
        // geklappt hat.
        //
        // Die Variante zaehlt die Ablehnungen dieser App an diesem Tag. Sie
        // muss sich nur unterscheiden — daraus wird die Saat, und die
        // entscheidet, was der Nachlauf zieht.
        const schonAbgelehnt = (liste.uebersicht ?? []).filter((p) => p.abgelehnt).length;
        const variante = Math.min(20, schonAbgelehnt + 1);
        await ruf('neu', { datum: liste.datum, app: liste.app, variante });
        ab.textContent = 'Abgelehnt — Ersatz wird erzeugt (ca. 10 min)';
      } catch (e) {
        ab.disabled = false;
        ab.textContent = `Fehler: ${e.message}`;
      }
    };
    knoepfe.append(ab);
  }

  k.append(knoepfe);
  if (nachtrag.childNodes.length) k.append(nachtrag);

  // ⚠ Nur wenn TikTok fuer diesen Beitrag ueberhaupt ansteht und noch nicht
  // gepostet ist. Ein zweiter Beitrag laesst sich nicht zurueckholen.
  // ⚠ Hier stand `post.istVideo &&` — Bildbeiträge bekamen den TikTok-Knopf
  // gar nicht erst zu sehen. Seit 19.09.2026 nimmt TikTok auch Fotobeiträge
  // (bis zu 35 Bilder, `media_type: PHOTO`), das Karussell also mit allen
  // sechs Folien.
  const tt = post.kanaele?.tiktok;
  if (!post.abgelehnt && tt && tt.stand !== 'veroeffentlicht' && liste.tiktok) {
    k.append(tiktokBlock(post, liste));
  }
  return k;
}

// Die Oberflaeche, die TikTok fuer den Direktversand vorschreibt.
//
// ⚠ JEDES Element hier ist eine Auflage, keine Designentscheidung:
//   · der Kontoname, damit klar ist, wohin gepostet wird
//   · die Sichtbarkeit OHNE Voreinstellung — der Mensch muss waehlen
//   · Kommentare/Duett/Stitch, alle ZUERST AUS
//   · Werbekennzeichnung, aus
//   · der Satz zur Music Usage Confirmation vor dem Knopf
// Wer hier etwas vorbelegt oder weglaesst, macht aus einer erlaubten
// Integration eine unerlaubte.
function tiktokBlock(post, liste) {
  const box = el('div', 'tt');
  box.append(el('h4', null, 'Auf TikTok posten'));
  box.append(el('p', 'konto', `Konto: ${liste.tiktok.nickname || liste.tiktok.username || '—'}`));

  const name = `tt-${liste.app}-${post.datei}`;
  const gewaehlt = { privacy: null, erlaubt: new Set(), werbung: new Set() };

  const BEZEICHNUNG = {
    PUBLIC_TO_EVERYONE: 'Öffentlich',
    MUTUAL_FOLLOW_FRIENDS: 'Freunde (gegenseitig gefolgt)',
    FOLLOWER_OF_CREATOR: 'Follower',
    SELF_ONLY: 'Nur ich',
  };

  box.append(el('p', 'titel', 'Wer darf es sehen?'));
  const gruppe = el('div', 'gruppe');
  for (const stufe of liste.tiktok.privacyOptionen ?? []) {
    const l = el('label');
    const r = document.createElement('input');
    r.type = 'radio'; r.name = name; r.value = stufe;
    // ⚠ Kein `checked`. Genau darauf besteht TikTok: „no default value".
    r.onchange = () => { gewaehlt.privacy = stufe; knopf.disabled = false; };
    l.append(r, document.createTextNode(BEZEICHNUNG[stufe] ?? stufe));
    gruppe.append(l);
  }
  box.append(gruppe);

  box.append(el('p', 'titel', 'Erlauben'));
  for (const [schluessel, text] of [['kommentare', 'Kommentare'], ['duett', 'Duett'], ['stitch', 'Stitch']]) {
    const l = el('label');
    const c = document.createElement('input');
    c.type = 'checkbox';           // ⚠ ohne `checked` — alle drei zuerst aus
    c.onchange = () => (c.checked ? gewaehlt.erlaubt.add(schluessel) : gewaehlt.erlaubt.delete(schluessel));
    l.append(c, document.createTextNode(text));
    box.append(l);
  }

  box.append(el('p', 'titel', 'Werbekennzeichnung'));
  for (const [schluessel, text] of [
    ['eigene', 'Bewirbt meine eigene Marke'],
    ['fremde', 'Bezahlte Partnerschaft'],
  ]) {
    const l = el('label');
    const c = document.createElement('input');
    c.type = 'checkbox';
    c.onchange = () => (c.checked ? gewaehlt.werbung.add(schluessel) : gewaehlt.werbung.delete(schluessel));
    l.append(c, document.createTextNode(text));
    box.append(l);
  }

  box.append(el('p', 'recht',
    'Mit dem Posten stimmst du TikToks Music Usage Confirmation zu.'));

  const knopf = el('button', null, 'Auf TikTok posten');
  knopf.disabled = true;           // erst nach der Wahl der Sichtbarkeit
  knopf.onclick = async () => {
    knopf.disabled = true; knopf.textContent = 'Wird gepostet …';
    try {
      await ruf('tiktok', {
        datum: liste.datum, app: liste.app, datei: post.datei,
        privacy: gewaehlt.privacy,
        erlaubt: [...gewaehlt.erlaubt],
        werbung: [...gewaehlt.werbung],
      });
      knopf.textContent = 'Läuft — dauert etwa eine Minute';
      setTimeout(laden, 60000);
    } catch (e) {
      knopf.disabled = false; knopf.textContent = 'Auf TikTok posten';
      alert(`Ging nicht: ${e.message}`);
    }
  };
  box.append(knopf);
  return box;
}

function appBlock(liste, datum) {
  const raus = document.createDocumentFragment();

  const kopf = el('div', 'app-kopf');
  kopf.append(el('h2', null, liste.name || liste.app));
  raus.append(kopf);

  // ⚠ ERLEDIGTES AUS DEM WEG (Josef, 20.09.2026: „Wenn Posts in der
  // Freigabe-App gepostet wurden, sollten sie nicht mehr auf der
  // Freigabeseite sein oder in einem Gepostet-Ordner").
  //
  // Bis heute stand alles in EINER Liste — auch das, wofuer es hier nichts
  // mehr zu tun gab. Nach einem Tag mit acht Beitraegen je App muss man jede
  // Karte einzeln lesen, um die zwei zu finden, die noch einen Knopf haben.
  //
  // ⚠ Geloescht wird nichts, nur einsortiert. Zwei Gruende: Die Seite prueft
  // an `irgendwoDraussen`, ob ein Beitrag schon veroeffentlicht ist (der
  // Ablehnen-Knopf verschwindet dann), und wer nachsehen will, was heute
  // rausging, braucht es zu sehen. Ausgeklappt wird mit einem Griff.
  const erledigt = (p) => {
    if (p.abgelehnt) return true;
    // Nur was UEBER DIESE SEITE laeuft, zaehlt: Facebook und Instagram.
    // TikTok wird in der TikTok-App freigegeben — dort haengt der Entwurf im
    // Posteingang, und ob er rausging, weiss diese Seite gar nicht. Ihn
    // mitzuzaehlen hiesse, Beitraege zu verstecken, die hier noch offen sind.
    const wege = ['facebook', 'instagram']
      .map((k) => p.kanaele?.[k]).filter(Boolean);
    return wege.length > 0 && wege.every((e) => e.stand === 'veroeffentlicht');
  };

  const alle = liste.uebersicht ?? [];
  const offen = alle.filter((p) => !erledigt(p));
  const fertig = alle.filter(erledigt);

  for (const post of offen) raus.append(postKarte(post, liste));

  if (!offen.length && alle.length) {
    const fertigHinweis = el('p', 'leise', 'Für heute ist hier alles erledigt.');
    fertigHinweis.style.margin = '14px 0';
    raus.append(fertigHinweis);
  }

  if (fertig.length) {
    const klappe = el('details');
    klappe.style.margin = '18px 0 6px';
    const titel = el('summary', 'leise',
      `${fertig.length} erledigt (${fertig.filter((p) => p.abgelehnt).length} abgelehnt) — antippen zum Ansehen`);
    titel.style.cursor = 'pointer';
    titel.style.padding = '8px 0';
    klappe.append(titel);
    for (const post of fertig) klappe.append(postKarte(post, liste));
    raus.append(klappe);
  }

  // ⚠ Hier stand bis zum 09.09.2026 ein Sammelknopf „Auf Instagram
  // veröffentlichen" für die ganze App. Er ist weg: Instagram wird jetzt wie
  // Facebook je Beitrag freigegeben, oben an der Karte. Ein Knopf, der immer
  // ALLES freigibt, ist genau dann falsch, wenn einer der Beiträge nicht
  // gefallen hat — und das ist der Grund, warum es die Seite gibt.
  //
  // Der zugehörige Lauf kann beides: Ohne Dateinamen gibt er weiterhin alles
  // Offene einer App frei. Von Hand ist das die schnellere Sammelfreigabe.
  return raus;
}

async function laden() {
  const ziel = $('#liste');
  ziel.replaceChildren(el('p', 'leise', 'Wird geladen …'));
  const datum = $('#datum').value;
  try {
    const { listen, datum: tag } = await ruf('liste', { datum });
    ziel.replaceChildren();
    if (!listen.length) {
      ziel.append(el('p', 'leise', `Für ${tag} liegt nichts vor. Entweder lief an dem Tag kein Lauf, oder er war nur ein Probelauf — Probeläufe legen bewusst nichts ab.`));
      return;
    }
    for (const liste of listen) ziel.append(appBlock(liste, tag));

    const ab = el('button', 'rand', 'Abmelden');
    ab.style.marginTop = '28px';
    ab.onclick = () => { localStorage.removeItem(SCHLUESSEL); location.reload(); };
    ziel.append(ab);
  } catch (e) {
    ziel.replaceChildren(el('p', 'leise', `Ging nicht: ${e.message}`));
  }
}

async function anmelden(eingabe) {
  passwort = eingabe;
  await ruf('liste', { datum: $('#datum').value });   // Probe: stimmt das Passwort?
  localStorage.setItem(SCHLUESSEL, eingabe);
  $('#tor').hidden = true;
  $('#inhalt').hidden = false;
  laden();
}

// ------------------------------------------------- Neuen Beitrag bauen
const zaehler = () => {
  const n = $('#k-text').value.trim().length;
  const z = $('#k-zaehler');
  z.textContent = `${n} / 240`;
  z.classList.toggle('voll', n > 240);
};
$('#k-text').addEventListener('input', zaehler);

// Video oder Karte: Das entscheidet über die Kanäle, nicht nur über das
// Aussehen — TikTok nimmt nur Videos. Und es blendet die zwei Felder aus, die
// es im Video nicht gibt.
const medium = () => {
  const reel = $('#k-medium').value === 'reel';
  $('#k-nurbild').hidden = reel;
  $('#k-medienhinweis').textContent = reel
    ? 'Ein Video geht auf alle drei Kanäle. Dauert etwa drei Minuten länger.'
    : 'Eine Karte geht auf Facebook und Instagram. TikTok nimmt nur Videos.';
};
$('#k-medium').addEventListener('change', medium);
medium();

$('#k-bauen').onclick = async () => {
  const knopf = $('#k-bauen');
  const stand = $('#k-stand');
  const text = $('#k-text').value.trim();

  if (!text) { stand.textContent = 'Ohne Text gibt es nichts zu zeichnen.'; return; }

  // ⚠ Knopf sperren, BEVOR gesendet wird. Ein zweiter Tipper während des
  // Wartens startet einen zweiten Lauf — und damit eine zweite Karte, die
  // dann ebenfalls in der Merkliste steht und freigegeben werden will.
  knopf.disabled = true;
  stand.textContent = 'Wird gestartet …';
  try {
    const reel = $('#k-medium').value === 'reel';
    await ruf('karte', {
      app: $('#k-app').value,
      medium: reel ? 'reel' : 'bild',
      text,
      // Beim Video leer — die Vorlage kennt sie nicht (siehe oben).
      haken: reel ? '' : $('#k-haken').value.trim(),
      marke: reel ? '' : $('#k-marke').value.trim(),
      cta: $('#k-cta').value.trim(),
    });
    stand.textContent = `Läuft. In etwa ${reel ? 'fünfzehn' : 'zehn'} Minuten steht `
      + `${reel ? 'das Video' : 'die Karte'} unten — dann oben auf „Laden" tippen.`;
    // Die Felder NICHT leeren: Geht etwas schief, wäre der getippte Text weg.
    // Der Knopf bleibt gesperrt, damit nicht aus Versehen dieselbe Karte
    // zweimal entsteht; ein Neuladen der Seite gibt ihn frei.
  } catch (e) {
    stand.textContent = `Ging nicht: ${e.message}`;
    knopf.disabled = false;
  }
};

$('#datum').value = new Date().toISOString().slice(0, 10);
$('#neu').onclick = laden;

$('#rein').onclick = async () => {
  $('#torfehler').textContent = '';
  try {
    await anmelden($('#pw').value);
  } catch (e) {
    $('#torfehler').textContent = e.message;
  }
};
$('#pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#rein').click(); });

// Schon einmal angemeldet? Dann still weiter.
const gemerkt = localStorage.getItem(SCHLUESSEL);
if (gemerkt) {
  anmelden(gemerkt).catch(() => {
    // Passwort in Vercel geändert — dann eben wieder fragen.
    localStorage.removeItem(SCHLUESSEL);
  });
}
</script>
